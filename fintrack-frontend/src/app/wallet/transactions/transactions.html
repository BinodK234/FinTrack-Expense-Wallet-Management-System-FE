<mat-card class="page">
    <div class="header">
        <div>
            <h2>Transactions</h2>
            <p>Your Complete transaction history</p>
        </div>
    </div>
    <table mat-table [dataSource]="dataSource" class="mat-elevation z1 full">
        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Date</th>
            <td mat-cell *matCellDef="let tx">
                {{ tx.createdAt | date:'mediumDate' }}
            </td>
        </ng-container>
        <ng-container matColumnDef="title">
             <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let tx">
        {{ tx.description || tx.category }}
      </td>
            </ng-container>

             <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let tx">
        <mat-chip>{{ tx.category }}</mat-chip>
      </td>
    </ng-container>

    <!-- Type -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let tx">
        <span [class.credit]="tx.type==='CREDIT'"
              [class.debit]="tx.type==='DEBIT'">
          {{ tx.type }}
        </span>
      </td>
    </ng-container>

    <!-- Amount -->
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Amount</th>
      <td mat-cell *matCellDef="let tx"
          [class.credit]="tx.type==='CREDIT'"
          [class.debit]="tx.type==='DEBIT'">
        {{ tx.type === 'CREDIT' ? '+' : '-' }}₹{{ tx.amount }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>

    </table>
    <mat-paginator [pageSize]="10"></mat-paginator>
</mat-card>
